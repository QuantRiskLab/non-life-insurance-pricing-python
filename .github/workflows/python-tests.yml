
name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q src
          
      - name: Run actuarial unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v


      - name: Run claim frequency simulation
        run: python src/claim_frequency.py

      - name: Run claim severity simulation
        run: python src/claim_severity.py

      - name: Run premium calculation
        run: python src/premium_calculation.py

      - name: Run Monte Carlo risk simulation
        run: python src/monte_carlo_risk.py

      - name: Generate risk visualization
        run: python src/risk_visualization.py

      - name: Run Poisson frequency GLM
        run: python src/frequency_glm.py

      - name: Run Gamma severity GLM
        run: python src/severity_glm.py

      - name: Run risk-based pricing model
        run: python src/risk_based_pricing.py
        
      - name: Validate Poisson frequency model
        run: python src/frequency_model_validation.py

        
      - name: Generate premium visualization
        run: python src/premium_visualization.py


      - name: Upload model results
        uses: actions/upload-artifact@v4
        with:
          name: actuarial-model-results
          path: |
            figures/aggregate_loss_distribution.png
            
            figures/risk_based_premium_analysis.png

            frequency_glm_results.csv
            severity_glm_results.csv
            risk_based_pricing_results.csv
          if-no-files-found: error
